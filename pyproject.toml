[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madhutwin"
version = "0.1.0"
description = "A hybrid physiological + ML digital twin for Type 2 Diabetes that fuses EHR and wearable streams to forecast glycaemic events."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.1",
  "torch>=2.2",
  "shap>=0.44",
  "fhir.resources>=8",
  "duckdb>=1.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
docs = ["python-pptx>=0.6", "reportlab>=4"]

[tool.setuptools.packages.find]
include = ["twin*", "api*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
